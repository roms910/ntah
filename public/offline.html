<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monochrome — Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .icon { font-size: 64px; margin-bottom: 24px; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; margin-bottom: 32px; }
        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="icon">🎵</div>
    <h1>You're Offline</h1>
    <p>Connect to the internet to stream music.<br>Your downloaded tracks are still available.</p>
    <button onclick="window.location.reload()">Try Again</button>

    <script>
        // Cek koneksi, kalau online langsung redirect ke app
        window.addEventListener('online', () => {
            window.location.href = '/';
        });
    </script>
</body>
</html>
