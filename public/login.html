<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monochrome — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .logo { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: -1px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 48px; }
        .card {
            width: 100%;
            max-width: 360px;
            background: #111;
            border-radius: 16px;
            padding: 24px;
        }
        .tab-bar {
            display: flex;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: #666;
            border: none;
            background: none;
        }
        .tab.active { background: #fff; color: #000; }
        input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus { border-color: #444; }
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-bottom: 12px;
        }
        .btn-white { background: #fff; color: #000; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #333; }
        .divider {
            text-align: center;
            color: #444;
            font-size: 12px;
            margin: 16px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: #222;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .oauth-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .error {
            color: #ff4444;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }
        .loading { opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body>
    <div class="logo">Monochrome</div>
    <div class="subtitle">Sign in to sync your library</div>

    <div class="card">
        <div class="tab-bar">
            <button class="tab active" onclick="switchTab('login')">Sign In</button>
            <button class="tab" onclick="switchTab('register')">Sign Up</button>
        </div>

        <div id="error" class="error"></div>

        <input type="email" id="email" placeholder="Email" autocomplete="email" />
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
        <input type="password" id="confirm-password" placeholder="Confirm Password" style="display:none" />

        <button class="btn btn-white" onclick="handleSubmit()">Continue</button>

        <div class="divider">or</div>

        <button class="oauth-btn" onclick="oauthLogin('google')">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
        </button>

        <button class="oauth-btn" onclick="oauthLogin('github')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            Continue with GitHub
        </button>

        <button class="oauth-btn" onclick="oauthLogin('discord')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028 14.09 14.09 0 001.226-1.994.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>
            Continue with Discord
        </button>
    </div>

    <script type="module">
        import { Client, Account } from 'https://cdn.jsdelivr.net/npm/appwrite@16/dist/esm/sdk.js';

        const client = new Client()
            .setEndpoint('https://fra.cloud.appwrite.io/v1')
            .setProject('69ffc51c0033c3455ae9');

        const account = new Account(client);

        let currentTab = 'login';

        window.switchTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            const confirmPass = document.getElementById('confirm-password');
            confirmPass.style.display = tab === 'register' ? 'block' : 'none';
            hideError();
        };

        window.showError = (msg) => {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        };

        window.hideError = () => {
            document.getElementById('error').style.display = 'none';
        };

        window.handleSubmit = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!email || !password) return showError('Please fill in all fields');

            const btn = document.querySelector('.btn-white');
            btn.classList.add('loading');
            btn.textContent = 'Please wait...';
            hideError();

            try {
                if (currentTab === 'register') {
                    if (password !== confirmPassword) return showError('Passwords do not match');
                    await account.create('unique()', email, password);
                }
                await account.createEmailPasswordSession(email, password);
                window.location.href = '/index.html';
            } catch (err) {
                showError(err.message || 'Login failed');
            } finally {
                btn.classList.remove('loading');
                btn.textContent = 'Continue';
            }
        };

        window.oauthLogin = (provider) => {
            account.createOAuth2Session(
                provider,
                window.location.origin + '/index.html?oauth=1',
                window.location.origin + '/login.html'
            );
        };
    </script>
</body>
</html>
