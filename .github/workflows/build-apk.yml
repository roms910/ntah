name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Install Google Auth plugin
        run: bun add @codetrix-studio/capacitor-google-auth --no-frozen-lockfile

      - name: Build web
        run: bunx vite build
        env:
          CI: false
      - name: Build web
        run: bun run build

      - name: Install Capacitor CLI
        run: |
          bun add -d @capacitor/cli --no-frozen-lockfile
          bun add @capacitor/browser --no-frozen-lockfile
          bun add @codetrix-studio/capacitor-google-auth --no-frozen-lockfile

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monochrome-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
